function recipe(i){var r=D[i];return '<div class="card"><span class="tag">'+r.c+'</span><div class="item" style="border:0"><div class="big">'+r.n+'</div>'+starBtn(i)+'</div><h2>🧺 재료</h2><div class="ing">'+r.i.map(esc).join(", ")+'</div><h2 style="margin-top:14px">👩‍🍳 만드는 법</h2><ol>'+r.s.map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+'</ol></div>'}

function show(i){detail=i;R();scrollTo(0,0)}
function R(){var m=document.getElementById("m"),h="";
document.querySelectorAll("nav button").forEach(function(b){b.className=b.dataset.t==tab?"on":""});
if(detail!==null){h='<button class="sub" onclick="detail=null;R()">← 뒤로 가기</button><div style="height:10px"></div>'+recipe(detail)+'<button onclick="addPlan('+detail+')">📅 이번 주 계획에 넣기</button>';m.innerHTML=h;return}
if(tab=="today"){var d=new Date();h='<div class="card"><h2>☀️ 오늘의 반찬</h2><div class="muted">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+"일월화수목금토"[d.getDay()]+'요일</div></div>'+recipe(todayIdx())+'<button class="sub" onclick="extra++;R()">🔄 다른 반찬 보기</button><button onclick="addPlan('+todayIdx()+')">📅 이번 주 계획에 넣기</button>'}
if(tab=="list"){h='<div class="chips">'+CATS.map(function(c){return'<button class="'+(c==cat&&!favOnly?"on":"")+'" onclick="cat=\''+c+'\';favOnly=false;R()">'+c+'</button>'}).join("")+'<button class="'+(favOnly?"on":"")+'" onclick="favOnly=true;R()">★ 즐겨찾기</button></div><div class="card">';var c=0;D.forEach(function(r,i){if(favOnly?fav.indexOf(i)>=0:(cat=="전체"||r.c==cat)){h+=row(i);c++}});if(!c)h+='<div class="muted">☆를 누르면 즐겨찾기에 담겨요.</div>';h+='</div>'}
if(tab=="fridge"){h='<div class="card"><h2>🧊 냉장고 재료로 찾기</h2><input id="q" placeholder="예: 두부, 감자 애호박" value="'+esc(window.Q||"")+'" oninput="Q=this.value;fr()"><div class="muted" style="margin-top:6px">재료 여러 개는 띄어쓰기나 쉼표로 적어요.</div></div><div class="card" id="fres"></div>';m.innerHTML=h;fr();return}
if(tab=="plan"){h='<div class="card"><h2>📅 이번 주 반찬 계획</h2>';DAYS.forEach(function(dn,k){h+='<div class="day"><b>'+dn+'</b><select onchange="setP('+k+',this.value)"><option value="">- 선택 안 함 -</option>'+D.map(function(r,i){return'<option value="'+i+'"'+(plan[k]==i&&plan[k]!==""?" selected":"")+'>'+r.n+'</option>'}).join("")+'</select></div>'});h+='<button class="sub" onclick="if(confirm(\'계획을 모두 지울까요?\')){plan={};sv(\'bc_plan\',plan);R()}">계획 모두 지우기</button></div>'}
if(tab=="shop"){var map={},ks=[];for(var k in plan){var i=plan[k];if(i===""||i==null)continue;D[i].i.forEach(function(x){var b=base(x);if(!map[b]){map[b]=[];ks.push(b)}if(map[b].indexOf(D[i].n)<0)map[b].push(D[i].n)})}
h='<div class="card shop"><h2>🛒 장보기 목록</h2>';if(!ks.length)h+='<div class="muted">\'주간계획\'에서 반찬을 고르면 필요한 재료가 여기에 모여요.</div>';ks.forEach(function(b){h+='<label><input type="checkbox"'+(chk[b]?" checked":"")+' onchange="chk[\''+b+'\']=this.checked;sv(\'bc_chk\',chk);R()"><span class="'+(chk[b]?"done":"")+'">'+esc(b)+' <span class="muted">('+map[b].join(", ")+')</span></span></label>'});if(ks.length)h+='<button class="sub" onclick="chk={};sv(\'bc_chk\',chk);R()">체크 모두 풀기</button>';h+='</div>'}
m.innerHTML=h}
function fr(){var q=(window.Q||"").split(/[\s,]+/).filter(Boolean),h="";if(!q.length){document.getElementById("fres").innerHTML='<div class="muted">있는 재료를 적으면 만들 수 있는 반찬을 보여 드려요.</div>';return}
var res=D.map(function(r,i){var s=0;q.forEach(function(w){if(r.i.some(function(x){return x.indexOf(w)>=0}))s++});return[s,i]}).filter(function(a){return a[0]>0}).sort(function(a,b){return b[0]-a[0]});
res.forEach(function(a){h+=row(a[1])});document.getElementById("fres").innerHTML=h||'<div class="muted">맞는 반찬이 없어요. 다른 재료로 찾아보세요.</div>'}
function setP(k,v){plan[k]=v;sv("bc_plan",plan)}
function addPlan(i){for(var k=0;k<7;k++){if(plan[k]===undefined||plan[k]===""){plan[k]=String(i);sv("bc_plan",plan);alert(DAYS[k]+"요일에 '"+D[i].n+"'을(를) 넣었어요!");return}}alert("이번 주 계획이 다 찼어요. 주간계획에서 바꿔 주세요.")}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;detail=null;R();scrollTo(0,0)}});
R();
</script></body></html>
