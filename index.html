<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>매일 반찬 만들기</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--sub:#7b7168;--line:#eee7de;--ac:#e2643b;--acs:#fdebe3;--ok:#2f8f6b;--warn:#f08a24;--bad:#d93b3b;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;line-height:1.55;letter-spacing:-.01em;padding-bottom:96px}
header{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 20px 12px;border-bottom:1px solid var(--line)}

main{padding:18px 16px;max-width:560px;margin:auto;animation:fade .25s ease}

.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(31,27,22,.04),0 8px 24px rgba(31,27,22,.06)}

.big{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0}

button.sub{background:#f1ece5;color:var(--ink)}button.ok{background:var(--ok)}
input,select{font:inherit;font-size:19px;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);transition:border-color .15s}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.item:last-child{border-bottom:0}
.item .t{font-size:20px;font-weight:700}
.ico{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--acs);display:flex;align-items:center;justify-content:center;flex:none}
.grow{flex:1;min-width:0}
.star{background:none;color:#f2a900;font-size:28px;width:auto;margin:0;padding:4px 6px}
ol{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol li{counter-increment:s;position:relative;padding:4px 0 10px 42px}
ol li:before{content:counter(s);position:absolute;left:0;top:3px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ings{display:flex;flex-wrap:wrap;gap:6px}.ings span{background:#f6f2ec;border-radius:10px;padding:5px 10px;font-size:16px}
.day{display:flex;align-items:center;gap:10px;margin:10px 0}.day b{width:34px;height:34px;flex:none;border-radius:50%;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px}
.chk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:19px}
.chk input{width:26px;height:26px;accent-color:var(--ok);flex:none}.done{text-decoration:line-through;color:#b3aaa1}
.badge{font-size:14px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff;white-space:nowrap}
.b-bad{background:var(--bad)}.b-warn{background:var(--warn)}.b-ok{background:#e7f3ee;color:var(--ok)}
.inv{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mini{width:auto;margin:0;padding:8px 12px;font-size:15px;border-radius:12px}
.seg{display:flex;background:#f1ece5;border-radius:14px;padding:4px;gap:4px}
.seg button{margin:0;padding:10px;font-size:16px;background:transparent;color:var(--sub);border-radius:11px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;margin:0;padding:6px 0;background:none;color:#a59b91;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button i{font-style:normal;font-size:24px;filter:grayscale(1);opacity:.6;transition:.15s}
nav button.on{color:var(--ac)}nav button.on i{filter:none;opacity:1;transform:translateY(-1px)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:17px;z-index:20;animation:fade .2s}
</style></head><body>
<header><div class="k" id="hk"></div><h1 id="ht">매일 반찬 만들기</h1></header>

if(tab=="today"){h='<div class="muted" style="margin:0 4px 10px">반찬 '+D.length+'가지 중 오늘의 추천이에요 😊</div>'+recipe(todayIdx())+'<div class="g2"><button class="sub" onclick="extra++;R()">🔄 다른 반찬</button><button onclick="addPlan('+todayIdx()+')">📅 계획에 넣기</button></div>';var ex=inv.filter(function(v){var n=dleft(v.e);return n!==null&&n<=3});if(ex.length)h+='<div class="card" style="margin-top:14px"><h2>⏰ 빨리 써야 할 재료</h2>'+ex.map(function(v){return'<div class="inv"><div class="grow t">'+esc(v.n)+'</div>'+badge(v.e)+'</div>'}).join("")+'</div>'}
if(tab=="list"){h='<div class="chips">'+CATS.map(function(c){return'<button class="'+(c==cat&&!favOnly?"on":"")+'" onclick="cat=\''+c+'\';favOnly=false;R()">'+(EMO[c]||"🍽️")+' '+c+'</button>'}).join("")+'<button class="'+(favOnly?"on":"")+'" onclick="favOnly=true;R()">⭐ 즐겨찾기</button></div><div class="card">';var c=0;D.forEach(function(r,i){if(favOnly?fav.indexOf(i)>=0:(cat=="전체"||r.c==cat)){h+=row(i);c++}});if(!c)h+='<div class="muted">☆를 누르면 즐겨찾기에 담겨요.</div>';h+='</div>'}
if(tab=="fridge"){h='<div class="seg" style="margin-bottom:14px"><button class="'+(fmode=="inv"?"on":"")+'" onclick="fmode=\'inv\';R()">🧊 냉장고 재고</button><button class="'+(fmode=="find"?"on":"")+'" onclick="fmode=\'find\';R()">🔍 재료로 찾기</button></div>';
if(fmode=="find"){h+='<div class="card"><h2>재료로 반찬 찾기</h2><input id="q" placeholder="예: 두부 감자 애호박" value="'+esc(Q)+'" oninput="Q=this.value;fr()"><div class="muted" style="margin-top:8px">여러 재료는 띄어쓰기나 쉼표로 적어요.</div></div><div class="card" id="fres"></div>';m.innerHTML=h;fr();return}
var list=inv.slice().sort(function(a,b){var x=dleft(a.e),y=dleft(b.e);if(x===null)x=1e9;if(y===null)y=1e9;return x-y});
if(showForm){var e=editId?inv.filter(function(v){return v.id==editId})[0]:{n:"",q:"",l:"냉장",a:todayStr(),e:""};
h+='<div class="card"><h2>'+(editId?"재료 고치기":"재료 넣기")+'</h2><label class="f">재료명</label><input id="fn" value="'+esc(e.n)+'" placeholder="예: 두부"><div class="g2"><div><label class="f">수량/단위</label><input id="fq" value="'+esc(e.q)+'" placeholder="예: 1모"></div><div><label class="f">보관 위치</label><select id="fl">'+["냉장","냉동","실온"].map(function(o){return'<option'+(o==e.l?" selected":"")+'>'+o+'</option>'}).join("")+'</select></div></div><div class="g2"><div><label class="f">넣은 날</label><input type="date" id="fa" value="'+esc(e.a)+'"></div><div><label class="f">유통기한</label><input type="date" id="fe" value="'+esc(e.e)+'"></div></div><button class="ok" onclick="saveInv()">저장하기</button><button class="sub" onclick="showForm=false;editId=null;R()">취소</button></div>'}
else h+='<button style="margin:0 0 14px" onclick="showForm=true;editId=null;R()">＋ 재료 넣기</button>';
h+='<div class="card"><h2>🧊 내 냉장고 <span class="muted">'+inv.length+'개</span></h2>';if(!list.length)h+='<div class="muted">재료를 넣으면 유통기한이 가까운 순서로 보여 드려요.</div>';
list.forEach(function(v){h+='<div class="inv"><div class="ico">'+({"냉장":"🧊","냉동":"❄️","실온":"🏠"}[v.l]||"🧊")+'</div><div class="grow"><div class="t" style="font-weight:700;font-size:20px">'+esc(v.n)+' <span class="muted">'+esc(v.q)+'</span></div><div class="muted">'+esc(v.l)+(v.a?' · '+esc(v.a.slice(5).replace("-","/"))+' 넣음':'')+'</div><div style="margin-top:4px">'+badge(v.e)+'</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="mini sub" onclick="editId=\''+v.id+'\';showForm=true;R();scrollTo(0,0)">고치기</button><button class="mini sub" style="color:var(--bad)" onclick="delInv(\''+v.id+'\')">삭제</button></div></div>'});
h+='</div>';if(inv.length)h+='<button onclick="fmode=\'cook\';R()">🍳 이 재료로 만들 수 있는 반찬</button>';
if(fmode=="cook"){var res=D.map(function(r,i){var hv=r.i.filter(have).length;return[hv/r.i.length,hv,i]}).filter(function(a){return a[1]>0}).sort(function(a,b){return b[0]-a[0]||b[1]-a[1]}).slice(0,15);
h+='<div class="card" style="margin-top:14px"><h2>🍳 만들 수 있는 반찬</h2>'+(res.length?res.map(function(a){var r=D[a[2]];return row(a[2],'재료 '+r.i.length+'개 중 '+a[1]+'개 있어요')+'<button class="mini sub" style="margin:0 0 8px 56px" onclick="missToShop('+a[2]+')">🛒 없는 재료 장보기에 담기</button>'}).join(""):'<div class="muted">맞는 반찬이 없어요.</div>')+'</div>'}}
if(tab=="plan"){h='<div class="card"><h2>📅 이번 주 반찬</h2>';DAYS.forEach(function(dn,k){h+='<div class="day"><b>'+dn+'</b><select onchange="setP('+k+',this.value)"><option value="">선택 안 함</option>'+CATS.slice(1).map(function(c){return'<optgroup label="'+c+'">'+D.map(function(r,i){return r.c==c?'<option value="'+i+'"'+(plan[k]!==undefined&&plan[k]!==""&&plan[k]==i?" selected":"")+'>'+r.n+'</option>':""}).join("")+'</optgroup>'}).join("")+'</select></div>'});h+='<button class="sub" onclick="if(confirm(\'계획을 모두 지울까요?\')){plan={};sv(\'bc_plan\',plan);R()}">계획 모두 지우기</button></div>'}
if(tab=="shop"){var map={},ks=[];function add(b,n){if(!map[b]){map[b]=[];ks.push(b)}if(n&&map[b].indexOf(n)<0)map[b].push(n)}
for(var k in plan){var i=plan[k];if(i===""||i==null||!D[i])continue;D[i].i.forEach(function(x){add(base(x),D[i].n)})}extraShop.forEach(function(x){add(x.b,x.n)});
h='<div class="card"><h2>🛒 장보기 목록</h2>';if(!ks.length)h+='<div class="muted">계획에서 반찬을 고르거나 \'없는 재료 담기\'를 누르면 여기에 모여요.</div>';
ks.forEach(function(b){var hv=have(b);h+='<label class="chk"><input type="checkbox"'+(chk[b]?" checked":"")+' onchange="chk[this.dataset.b]=this.checked;sv(\'bc_chk\',chk);R()" data-b="'+esc(b)+'"><span class="grow '+(chk[b]?"done":"")+'">'+esc(b)+(hv?' <span class="badge b-ok">냉장고에 있음</span>':'')+'<br><span class="muted">'+esc(map[b].join(", "))+'</span></span></label>'});
if(ks.length)h+='<div class="g2"><button class="sub" onclick="chk={};sv(\'bc_chk\',chk);R()">체크 풀기</button><button class="sub" onclick="extraShop=[];sv(\'bc_extra\',extraShop);R()">담은 재료 비우기</button></div>';h+='</div>'}
m.innerHTML=h}
function fr(){var q=Q.split(/[\s,]+/).filter(Boolean),h="",el=document.getElementById("fres");if(!q.length){el.innerHTML='<div class="muted">있는 재료를 적으면 만들 수 있는 반찬을 보여 드려요.</div>';return}
var res=D.map(function(r,i){var s=0;q.forEach(function(w){if(r.i.some(function(x){return x.indexOf(w)>=0}))s++});return[s,i]}).filter(function(a){return a[0]>0}).sort(function(a,b){return b[0]-a[0]});
res.forEach(function(a){h+=row(a[1])});el.innerHTML=h||'<div class="muted">맞는 반찬이 없어요. 다른 재료로 찾아보세요.</div>'}
function saveInv(){var n=document.getElementById("fn").value.trim();if(!n){alert("재료명을 적어 주세요.");return}
var o={id:editId||String(Date.now()),n:n,q:document.getElementById("fq").value.trim(),l:document.getElementById("fl").value,a:document.getElementById("fa").value,e:document.getElementById("fe").value};
if(editId)inv=inv.map(function(v){return v.id==editId?o:v});else inv.push(o);sv("bc_inv",inv);showForm=false;editId=null;toast("저장했어요");R()}
function delInv(id){if(!confirm("이 재료를 지울까요?"))return;inv=inv.filter(function(v){return v.id!=id});sv("bc_inv",inv);R()}
function missToShop(i){var c=0;D[i].i.forEach(function(x){if(!have(x)){var b=base(x);if(!extraShop.some(function(e){return e.b==b})){extraShop.push({b:b,n:D[i].n});c++}}});sv("bc_extra",extraShop);toast(c?"재료 "+c+"개를 장보기에 담았어요":"모두 있거나 이미 담겨 있어요")}
function setP(k,v){plan[k]=v;sv("bc_plan",plan)}
function addPlan(i){for(var k=0;k<7;k++){if(plan[k]===undefined||plan[k]===""){plan[k]=String(i);sv("bc_plan",plan);toast(DAYS[k]+"요일에 '"+D[i].n+"' 넣었어요");return}}alert("이번 주 계획이 다 찼어요. 계획 탭에서 바꿔 주세요.")}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;detail=null;if(tab=="fridge"&&fmode=="cook")fmode="inv";R();scrollTo(0,0)}});
R();
</script></body></html>
